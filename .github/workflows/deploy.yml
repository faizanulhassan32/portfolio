name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. Shallow clone (takes 1s)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Setup pnpm package manager (takes 2s)
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Setup Node.js with built-in pnpm store cache (takes 3s)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 4. Fast dependency install (takes 3s)
      - run: pnpm install --no-frozen-lockfile

      # 5. Fast Vite build + immediate exit (takes 3.7s instead of 56s)
      - run: pnpm build

      # 6. Package dist output (takes 2s)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 7. Publish live to GitHub Pages (takes 8s)
      - id: deployment
        uses: actions/deploy-pages@v4